name: docs

on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "internal/**"
      - "cmd/**"
      - "scaffold/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; let a newer run supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o nemi .
      - name: Build docs site
        working-directory: www
        run: ../nemi build
      - uses: actions/configure-pages@v5
        with:
          enablement: true # turn on Pages (Actions source) automatically
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
