<script>(function(){try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{if .Page.Title}}{{.Page.Title}} · {{end}}{{.Site.Config.Title}}</title>
{{if .Page.Description}}<meta name="description" content="{{.Page.Description}}">{{else if .Site.Config.Description}}<meta name="description" content="{{.Site.Config.Description}}">{{end}}
{{if .Page.Permalink}}<link rel="canonical" href="{{.Page.Permalink}}">{{end}}
<link rel="alternate" type="application/rss+xml" title="{{.Site.Config.Title}}" href="/feed.xml">
<link rel="stylesheet" href="/style.css">
{{if .Page.Math}}<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">{{end}}
