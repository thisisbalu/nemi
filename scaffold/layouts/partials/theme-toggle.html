<button class="theme-toggle" type="button" aria-label="Toggle light/dark theme" onclick="(function(d){var cur=d.dataset.theme;var dark=cur?cur==='dark':matchMedia('(prefers-color-scheme:dark)').matches;var next=dark?'light':'dark';d.dataset.theme=next;try{localStorage.setItem('theme',next);}catch(e){}})(document.documentElement)">◐</button>
