{{define "search"}}
<div class="search-modal" hidden>
  <div class="search-panel">
    <input type="search" class="search-input" placeholder="Search…" aria-label="Search" autocomplete="off" spellcheck="false">
    <ul class="search-results" role="listbox"></ul>
    <p class="search-empty" hidden>No matches.</p>
    <p class="search-hint"><kbd>↑</kbd><kbd>↓</kbd> to navigate · <kbd>↵</kbd> to open · <kbd>esc</kbd> to close</p>
  </div>
</div>
<script>
(function () {
  var modal = document.querySelector('.search-modal');
  if (!modal) return;
  var input = modal.querySelector('.search-input');
  var list = modal.querySelector('.search-results');
  var empty = modal.querySelector('.search-empty');
  var index = null, sel = -1;

  function open() {
    modal.hidden = false;
    document.body.style.overflow = 'hidden';
    input.focus();
    input.select();
    if (index === null) load();
  }
  function close() {
    modal.hidden = true;
    document.body.style.overflow = '';
  }
  function load() {
    fetch((window.__nemiBase || '') + '/search-index.json')
      .then(function (r) { return r.json(); })
      .then(function (d) { index = d; run(); })
      .catch(function () { index = []; });
  }
  function esc(s) {
    return s.replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function highlight(text, toks) {
    var out = esc(text);
    toks.forEach(function (t) {
      if (!t) return;
      var re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
      out = out.replace(re, '<mark>$1</mark>');
    });
    return out;
  }
  function snippet(body, tok) {
    var i = tok ? body.toLowerCase().indexOf(tok) : -1;
    if (i < 0) return body.slice(0, 120);
    var start = Math.max(0, i - 40);
    return (start > 0 ? '…' : '') + body.slice(start, i + 90) + (i + 90 < body.length ? '…' : '');
  }
  function run() {
    if (index === null) return;
    var q = input.value.trim().toLowerCase();
    if (!q) { render([], []); return; }
    var toks = q.split(/\s+/);
    var scored = [];
    index.forEach(function (e) {
      var title = e.title.toLowerCase();
      var tags = (e.tags || []).join(' ').toLowerCase();
      var body = e.body.toLowerCase();
      var hay = title + ' ' + tags + ' ' + body;
      if (!toks.every(function (t) { return hay.indexOf(t) >= 0; })) return;
      var score = 0;
      toks.forEach(function (t) {
        if (title.indexOf(t) >= 0) score += 10;
        if (tags.indexOf(t) >= 0) score += 5;
        score += body.split(t).length - 1;
      });
      scored.push({ e: e, score: score });
    });
    scored.sort(function (a, b) { return b.score - a.score; });
    render(scored.slice(0, 8), toks);
  }
  function render(items, toks) {
    list.innerHTML = '';
    sel = items.length ? 0 : -1;
    empty.hidden = !(input.value.trim() && items.length === 0);
    items.forEach(function (it, idx) {
      var e = it.e;
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = e.url;
      a.className = 'sr' + (idx === 0 ? ' active' : '');
      a.setAttribute('role', 'option');
      a.innerHTML = '<span class="sr-title">' + highlight(e.title, toks) + '</span>' +
        '<span class="sr-snip">' + highlight(snippet(e.body, toks[0]), toks) + '</span>';
      li.appendChild(a);
      list.appendChild(li);
    });
  }
  function move(d) {
    var as = list.querySelectorAll('.sr');
    if (!as.length) return;
    if (as[sel]) as[sel].classList.remove('active');
    sel = (sel + d + as.length) % as.length;
    as[sel].classList.add('active');
    as[sel].scrollIntoView({ block: 'nearest' });
  }

  input.addEventListener('input', run);
  document.querySelectorAll('[data-search-open]').forEach(function (b) {
    b.addEventListener('click', open);
  });
  modal.addEventListener('click', function (e) { if (e.target === modal) close(); });
  document.addEventListener('keydown', function (e) {
    var typing = /input|textarea|select/i.test(document.activeElement.tagName);
    if (((e.metaKey || e.ctrlKey) && e.key === 'k') || (e.key === '/' && !typing && modal.hidden)) {
      e.preventDefault();
      open();
    } else if (!modal.hidden) {
      if (e.key === 'Escape') close();
      else if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
      else if (e.key === 'Enter') {
        var a = list.querySelectorAll('.sr')[sel];
        if (a) location.href = a.href;
      }
    }
  });
})();
</script>
{{end}}
